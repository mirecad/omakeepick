name: Release

# Push a tag vX.Y.Z matching manifest.json and daemon/Cargo.toml. The plugin's bin/install
# downloads the binary attached here and checks it against the .sha256 file.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more systems
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the plugin version
        run: |
          plugin="$(jq -r .version manifest.json)"
          test "v$plugin" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest $plugin"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --release
        working-directory: daemon
      - run: cargo build --locked --release
        working-directory: daemon
      - name: Package
        run: |
          mkdir dist
          cp daemon/target/release/omakeepickd dist/omakeepickd-x86_64-linux
          cd dist && sha256sum omakeepickd-x86_64-linux > omakeepickd-x86_64-linux.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/omakeepickd-x86_64-linux
            dist/omakeepickd-x86_64-linux.sha256
          generate_release_notes: true
